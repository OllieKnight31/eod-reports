<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Closer Post-Call Report</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #1a1a2e; --bg-card: #16213e; --border: #2a2a4a; --text: #e0e0e0; --text-dim: #8888aa; --green: #2ECC71; --red: #E74C3C; --accent: #2ECC71; }
  body { font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; }
  .header { text-align: center; padding: 24px 0 16px; }
  .header__brand { font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  .header__title { font-size: 24px; font-weight: 700; }
  .header__sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  label .req { color: var(--red); }
  input, select, textarea { width: 100%; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 80px; resize: vertical; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { width: 100%; padding: 14px; background: var(--accent); color: #0c0c1a; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
  .status.ok  { background: rgba(46,204,113,0.1); border: 1px solid rgba(46,204,113,0.3); color: var(--green); }
  .status.err { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); color: var(--red); }
  .conditional { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header__brand" id="brandName">EOD System</div>
    <div class="header__title">Closer Post-Call Report</div>
    <div class="header__sub">Log the outcome of a sales call.</div>
  </div>

  <form id="form">
    <div class="form-group"><label>Closer Name <span class="req">*</span></label><input name="closer" required></div>
    <div class="grid-2">
      <div class="form-group"><label>Date <span class="req">*</span></label><input type="date" name="date" required></div>
      <div class="form-group"><label>Lead Source <span class="req">*</span></label><select name="lead_source" id="leadSource" required></select></div>
    </div>
    <div class="form-group"><label>Setter (who booked it)</label><input name="setter" placeholder="Optional"></div>

    <div class="grid-2">
      <div class="form-group"><label>Prospect Name <span class="req">*</span></label><input name="prospect_name" required></div>
      <div class="form-group"><label>Prospect Email</label><input type="email" name="prospect_email"></div>
    </div>

    <div class="form-group">
      <label>Outcome <span class="req">*</span></label>
      <select name="outcome" id="outcome" required>
        <option value="">Select</option>
        <option value="closed_won">Closed Won</option>
        <option value="closed_lost">Closed Lost</option>
        <option value="follow_up">Needs Follow-up</option>
        <option value="no_show">No Show</option>
        <option value="rescheduled">Rescheduled</option>
      </select>
    </div>

    <div class="conditional" id="closedWonFields">
      <div class="grid-2">
        <div class="form-group"><label>Package Sold</label><input name="package"></div>
        <div class="form-group"><label>Ticket Price</label><input type="number" name="ticket" min="0" step="any"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Payment Type</label><select name="payment_type"><option value="">Select</option><option>Paid in Full</option><option>Deposit</option><option>Payment Plan</option></select></div>
        <div class="form-group"><label>Payment Received</label><input name="payment_received" placeholder="Amount or 'Yes'"></div>
      </div>
    </div>

    <div class="conditional" id="closedLostFields">
      <div class="form-group"><label>Lost Reason</label><select name="lost_reason"><option value="">Select</option><option>Price</option><option>Timing</option><option>Spouse / Decision-maker</option><option>Need to think</option><option>Wrong fit</option><option>Other</option></select></div>
      <div class="form-group"><label>Objections</label><textarea name="objections" placeholder="Top 1-3 objections raised"></textarea></div>
    </div>

    <div class="conditional" id="followUpFields">
      <div class="form-group"><label>Follow-up Date</label><input type="date" name="follow_up_date"></div>
    </div>

    <div class="form-group"><label>Recording URL</label><input name="recording_url" placeholder="https://..."></div>
    <div class="form-group"><label>Notes</label><textarea name="notes" placeholder="Anything else worth capturing"></textarea></div>

    <button type="submit" id="submitBtn">Submit Call Report</button>
    <div id="status" class="status"></div>
  </form>
</div>

<script>
const API = '/api';

async function bootstrap() {
  try {
    const r = await fetch(API + '?action=config', { cache: 'no-store' });
    const cfg = await r.json();
    if (cfg && cfg.brand) {
      document.getElementById('brandName').textContent = cfg.brand.name || 'EOD System';
      if (cfg.brand.color) document.documentElement.style.setProperty('--accent', cfg.brand.color);
      document.title = `${cfg.brand.name || 'EOD System'}, Closer Report`;
    }
    document.getElementById('leadSource').innerHTML = (cfg.lead_sources || ['Webinar']).map(s => `<option>${s}</option>`).join('');
  } catch (e) { /* keep defaults */ }
  document.querySelector('input[name=date]').value = new Date().toISOString().slice(0, 10);
}
bootstrap();

document.getElementById('outcome').addEventListener('change', (e) => {
  const v = e.target.value;
  document.getElementById('closedWonFields').style.display  = v === 'closed_won'  ? 'block' : 'none';
  document.getElementById('closedLostFields').style.display = v === 'closed_lost' ? 'block' : 'none';
  document.getElementById('followUpFields').style.display   = v === 'follow_up' || v === 'rescheduled' ? 'block' : 'none';
});

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  status.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Submitting…';

  const data = Object.fromEntries(new FormData(e.target));
  try {
    const r = await fetch(API + '?source=closer_outcome', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const json = await r.json();
    if (json.status !== 'received') throw new Error(json.message || 'submission failed');
    status.className = 'status ok'; status.textContent = '✓ Outcome logged. Thanks!'; status.style.display = 'block';
    e.target.reset();
    document.querySelector('input[name=date]').value = new Date().toISOString().slice(0, 10);
    document.querySelectorAll('.conditional').forEach(el => el.style.display = 'none');
  } catch (err) {
    status.className = 'status err'; status.textContent = '✗ ' + err.message; status.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Submit Call Report';
  }
});
</script>
</body>
</html>
